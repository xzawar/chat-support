# Cuts a release: signed APK + the manifest the app polls, both attached to a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v7.0.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      DOWNLOAD_URL: https://keykraftt.com/app/download

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Add the contents of"
            echo "::error::app/google-services.json as a repository secret of that name."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          jq -e '.project_info.project_id' app/google-services.json > /dev/null

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An update can only install over an existing"
            echo "::error::install when both APKs are signed by the same key, so an unsigned or"
            echo "::error::differently-signed release would be uninstallable as an update."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect the APK and build the update manifest
        id: manifest
        run: |
          set -euo pipefail
          mkdir -p dist

          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::No signed app-release.apk was produced. Check the keystore secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk

          VERSION_CODE="$(grep -m1 -E '^\s*versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+')"
          VERSION_NAME="$(grep -m1 -E '^\s*versionName\s*=' app/build.gradle.kts | cut -d'"' -f2)"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts."
            exit 1
          fi

          if [ "v${VERSION_NAME}" != "${TAG}" ]; then
            echo "::warning::Tag ${TAG} does not match versionName ${VERSION_NAME} in app/build.gradle.kts."
          fi

          SIZE_BYTES="$(stat -c%s dist/app-release.apk)"

          NOTES="$(git tag -l --format='%(contents:body)' "${TAG}" | sed '/^$/d' || true)"
          if [ -z "${NOTES}" ]; then
            PREVIOUS="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "${PREVIOUS}" ]; then
              NOTES="$(git log --no-merges --pretty='- %s' "${PREVIOUS}..${TAG}")"
            else
              NOTES="- First tracked release."
            fi
          fi

          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg apkUrl "${DOWNLOAD_URL}" \
            --arg changelog "${NOTES}" \
            --argjson sizeBytes "${SIZE_BYTES}" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, changelog: $changelog, mandatory: false, sizeBytes: $sizeBytes}' \
            > dist/latest.json

          echo "--- latest.json ---"
          cat dist/latest.json
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          files: |
            dist/app-release.apk
            dist/latest.json
          generate_release_notes: true
