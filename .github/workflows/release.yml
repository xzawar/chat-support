# Cuts a release: signed APK + the manifest the app polls, both attached to a GitHub Release.
#
# Triggered by pushing a version tag, not by pushing to a branch. A release is a deliberate act,
# and tying it to a tag means the exact commit that produced an APK is recorded permanently and
# cannot drift the way "latest build on main" does.
#
# Existing android.yml is untouched: it builds a debug APK on every push and stays the fast check.
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs are allowed so a failed publish can be retried without inventing a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v7.0.3"
        required: true

permissions:
  # Needed to create the Release and upload assets. Nothing else is granted.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # The URL the app is told to download from. It must be YOUR domain rather than a
      # github.com link, because this value ends up compiled into nothing - it is served in the
      # manifest and read at runtime, so it can be repointed later without shipping a new APK.
      # CHANGE THIS to match your host.
      DOWNLOAD_URL: https://keykraftt.com/app/download

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history, so the changelog step can see the previous tag. The default shallow
          # clone has no earlier tags and would produce an empty changelog.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # app/google-services.json is deliberately gitignored, so it is not in the checkout.
          # The Google Services Gradle plugin aborts without it, at :app:processReleaseGoogleServices,
          # which is a confusing place to discover the file is missing - hence the explicit check.
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Add the contents of"
            echo "::error::app/google-services.json as a repository secret of that name."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          # Validate rather than trust: a truncated or re-wrapped paste produces a file that looks
          # present but fails later with an unhelpful parser error.
          jq -e '.project_info.project_id' app/google-services.json > /dev/null

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An update can only install over an existing"
            echo "::error::install when both APKs are signed by the same key, so an unsigned or"
            echo "::error::differently-signed release would be uninstallable as an update."
            exit 1
          fi
          # A keystore is binary, so it is stored base64-encoded in the secret and decoded to a
          # path outside the workspace - never inside it, where a later step could archive it.
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      - name: Build the signed release APK
        env:
          # Consumed by the signingConfigs block in app/build.gradle.kts.
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect the APK and build the update manifest
        id: manifest
        run: |
          set -euo pipefail
          mkdir -p dist

          # An unsigned artifact is a failure, not something to publish. Gradle names it
          # app-release-unsigned.apk when no signing config applied, so the name is the check.
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::No signed app-release.apk was produced. Check the keystore secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk

          # versionCode is read from the build file rather than derived from the tag: it is what
          # the app actually compares, and it must be the value that was really compiled in.
          VERSION_CODE="$(grep -m1 -E '^\s*versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+')"
          VERSION_NAME="$(grep -m1 -E '^\s*versionName\s*=' app/build.gradle.kts | cut -d'"' -f2)"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts."
            exit 1
          fi

          # Guard against the mistake that silently breaks the updater: tagging a release without
          # bumping versionCode. The APK would upload fine and no installed app would ever offer
          # it, because the check is versionCode > installed versionCode.
          if [ "v${VERSION_NAME}" != "${TAG}" ]; then
            echo "::warning::Tag ${TAG} does not match versionName ${VERSION_NAME} in app/build.gradle.kts."
          fi

          SIZE_BYTES="$(stat -c%s dist/app-release.apk)"

          # Changelog: the annotated tag's own message if there is one, otherwise the commit
          # subjects since the previous tag. Both are already written by hand at release time.
          NOTES="$(git tag -l --format='%(contents:body)' "${TAG}" | sed '/^$/d' || true)"
          if [ -z "${NOTES}" ]; then
            PREVIOUS="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "${PREVIOUS}" ]; then
              NOTES="$(git log --no-merges --pretty='- %s' "${PREVIOUS}..${TAG}")"
            else
              NOTES="- First tracked release."
            fi
          fi

          # jq builds the JSON so that quotes, newlines and apostrophes in the changelog are
          # escaped properly. Hand-written JSON in a shell heredoc breaks the first time a commit
          # message contains a double quote, and a malformed manifest disables the whole feature.
          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg apkUrl "${DOWNLOAD_URL}" \
            --arg changelog "${NOTES}" \
            --argjson sizeBytes "${SIZE_BYTES}" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, changelog: $changelog, mandatory: false, sizeBytes: $sizeBytes}' \
            > dist/latest.json

          echo "--- latest.json ---"
          cat dist/latest.json
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          # Stable asset names. The whole redirect scheme depends on these filenames never
          # changing, because /releases/latest/download/<name> is resolved by name.
          files: |
            dist/app-release.apk
            dist/latest.json
          generate_release_notes: true
