name: Android build

# A real compile, on a runner that has the SDK and can reach Google Maven.
# Push to a branch and read the log; the APK lands in the run artifacts.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.3 targets 17. Anything newer fails before it reaches your code.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # app/google-services.json is gitignored, so it has to be supplied here too or the Google
      # Services plugin fails the build. Note that pull requests opened from forks receive no
      # secrets at all, so this step cannot succeed on those; that is a GitHub restriction and the
      # reason the message below says what it does rather than just failing.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is unavailable. Add it under Settings ->"
            echo "::error::Secrets and variables -> Actions. Forked pull requests never receive"
            echo "::error::secrets, so this job cannot build them."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      # Compiles Kotlin and links resources without the slower packaging steps,
      # so a syntax error surfaces in about a minute.
      - name: Compile
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: support-chat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
